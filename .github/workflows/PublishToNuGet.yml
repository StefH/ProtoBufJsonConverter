name: Publish to NuGet

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build, Pack, and Publish
    runs-on: windows-latest
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job

    steps:
    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Build projects
      shell: pwsh
      run: |
        Get-ChildItem ./src, ./src-webcil -Recurse -Filter *.csproj |
        ForEach-Object {
          dotnet build $_.FullName -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: Pack projects
      shell: pwsh
      run: |
        Get-ChildItem ./src, ./src-webcil -Recurse -Filter *.csproj |
        ForEach-Object {
          dotnet pack $_.FullName -c Release --no-build -o ./packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        $packages = Get-ChildItem ./packages -File -Filter *.nupkg |
          Where-Object {
            $_.Name -match '^(ProtoBufJsonConverter|MetadataReferenceService\.[^.]+)\..+\.nupkg$' -and
            $_.Name -notlike '*.symbols.nupkg'
          }

        if (-not $packages) {
          throw 'No ProtoBufJsonConverter or MetadataReferenceService packages were found to publish.'
        }

        $packages | ForEach-Object {
          dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }